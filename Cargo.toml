[package]
name = "mini3d"
version = "0.1.0"
edition = "2021"
authors = ["mencraft <ekemboy@gmail.com>"]

[dependencies]
wgpu = "26"
winit = "0.30"
glam = { version = "0.30", features = ["bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
env_logger = "0.11"
log = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[profile.dev.package."*"]
opt-level = 2
